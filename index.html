<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Ad Campaign Generator</title>
  <link rel="stylesheet" href="CSS/styles.css">
  <link rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>

<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">Advertising Tool</p>
      <h1>AI Ad Campaign Generator</h1>
      <p class="subtitle">Generate campaign strategy, ad copy, and creative ideas in seconds.</p>
    </header>

    <section class="generator-shell" aria-label="Ad campaign generator">
      <form id="campaign-form" class="panel form-panel">
        <h2>Campaign Inputs</h2>
        <div class="form-grid">
          <label>Business / Product
            <input id="product" type="text" placeholder="e.g. FitFuel Protein Bars" required>
          </label>

          <label>Campaign Objective
            <select id="objective" required>
              <option value="">Select objective</option>
              <option value="Brand Awareness">Brand Awareness</option>
              <option value="Lead Generation">Lead Generation</option>
              <option value="Sales Conversion">Sales Conversion</option>
              <option value="App Installs">App Installs</option>
            </select>
          </label>

          <label>Target Audience
            <input id="audience" type="text" placeholder="e.g. Busy professionals, 25-40" required>
          </label>

          <label>Monthly Budget (USD)
            <input id="budget" type="number" min="100" step="50" placeholder="e.g. 3000" required>
          </label>

          <label>Brand Voice
            <select id="tone" required>
              <option value="">Select tone</option>
              <option value="Professional">Professional</option>
              <option value="Bold">Bold</option>
              <option value="Friendly">Friendly</option>
              <option value="Luxury">Luxury</option>
            </select>
          </label>

          <fieldset class="channels">
            <legend>Channels</legend>
            <label><input type="checkbox" name="channel" value="Google Search" checked>Google Search</label>
            <label><input type="checkbox" name="channel" value="Meta Ads" checked>Meta Ads</label>
            <label><input type="checkbox" name="channel" value="TikTok">TikTok</label>
            <label><input type="checkbox" name="channel" value="LinkedIn">LinkedIn</label>
            <label><input type="checkbox" name="channel" value="YouTube">YouTube</label>
          </fieldset>
        </div>

        <button type="submit" class="btn">Generate Campaign</button>
      </form>

      <article class="panel output-panel" id="result" aria-live="polite">
        <h2>Generated Campaign</h2>
        <p class="hint">Fill in your details and click <strong>Generate Campaign</strong>.</p>
      </article>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
